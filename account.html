<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Account | Financial Times — Fedor Testing</title>
  <link rel="stylesheet" href="styles.css?v=2">
  <!-- Amplitude: Analytics SDK, then Web Experiment (needs the SDK and must sit in <head> so variants apply before paint). -->
  <script src="https://cdn.amplitude.com/libs/analytics-browser-2.47.2-min.js.gz"></script>
  <script src="config.js"></script>
  <script src="https://cdn.amplitude.com/script/d89aa21c87650120100bf394c158c4f4.experiment.js"></script>
  <script src="app.js"></script>
</head>
<body class="auth" data-page="account">
  <header class="auth-header"><a class="logo" href="index.html" data-track="logo_click">Financial Times</a></header>

  <main class="account-main">
    <div class="account-grid">
      <section class="account-details">
        <h1>My Account</h1>
        <dl>
          <dt>Signed in as</dt>
          <dd id="account-email">—</dd>
          <dt>Subscription</dt>
          <dd>Standard Digital (mock)</dd>
        </dl>
        <p style="margin-top:32px"><a href="index.html" class="btn btn-teal" data-track="account_back_home">Back to homepage</a>
        <a href="index.html" class="btn btn-outline" id="sign-out" data-track="sign_out_click">Sign out</a></p>
      </section>

      <!-- Subscription panel: "Control" layout used for the Web Experiment on this page. -->
      <aside class="sub-panel" id="subscription-panel">
        <div class="sub-card">
          <h3>Next payment will be taken on</h3>
          <p class="sub-date">Apr 19, 2026</p>
        </div>
        <div class="sub-card">
          <h2>Change your subscription</h2>
          <p>See if there is another package that better suits your needs.</p>
          <a href="#" class="btn btn-teal btn-block" id="change-subscription" data-track="change_subscription_click">Change subscription</a>
        </div>
        <a href="#" class="sub-card sub-row" id="cancel-subscription" data-track="cancel_subscription_click">
          <span>Cancel my subscription</span>
          <span class="chev" aria-hidden="true">&#8250;</span>
        </a>
      </aside>
    </div>
  </main>

</body>
</html>
